<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>个人财务管理系统</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            color: #0f172a;
            /* 更接近 wzizai 的柔和蓝紫光感：上方两侧+底部托起 */
            background:
                radial-gradient(circle at 0% 0%, rgba(125, 211, 252, 0.35), transparent 55%),
                radial-gradient(circle at 100% 0%, rgba(165, 180, 252, 0.4), transparent 55%),
                radial-gradient(circle at 50% 130%, rgba(191, 219, 254, 0.45), transparent 60%),
                #f3f6fb;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* 顶部导航 */

        .header {
            height: 58px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(148, 163, 184, 0.22);
            backdrop-filter: blur(16px);
            background: linear-gradient(to bottom,
                    rgba(248, 250, 252, 0.97),
                    rgba(248, 250, 252, 0.9));
        }

        .header__inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo__mark {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            border: 1px solid rgba(15, 23, 42, 0.12);
            background: radial-gradient(circle at 30% 30%, #1d4ed8, #020617);
        }

        .logo__text {
            font-size: 15px;
            font-weight: 600;
        }

        .header__actions {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #6b7280;
        }

        .header__link {
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
            color: inherit;
        }

        .btn {
            border-radius: 8px;
            padding: 0 16px;
            height: 32px;
            font-size: 13px;
            border: 1px solid transparent;
            cursor: pointer;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn--primary {
            background: #1d4ed8;
            color: #ffffff;
        }

        .btn--ghost {
            background: transparent;
            color: #0f172a;
            border-color: rgba(15, 23, 42, 0.16);
        }

        /* Hero 主区域 */

        .hero {
            padding: 88px 0 52px;
        }

        .hero__inner {
            text-align: center;
        }

        .hero__badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            color: #4b5563;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.38);
            backdrop-filter: blur(10px);
            margin-bottom: 18px;
        }

        .hero__title {
            margin: 0 0 14px;
            font-size: 34px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .hero__subtitle {
            margin: 0 0 26px;
            font-size: 14px;
            color: #4b5563;
            /* 稍微加深一点，让文案存在感更好 */
        }

        .hero__actions {
            display: inline-flex;
            gap: 12px;
            margin-bottom: 26px;
        }

        .hero__hint {
            font-size: 12px;
            color: #94a3b8;
        }

        /* 概览卡片区 */

        .hero-metrics {
            margin-top: 34px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .metric-card {
            padding: 16px 18px;
            border-radius: 18px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(241, 245, 255, 0.95));
            border: 1px solid rgba(148, 163, 184, 0.4);
            box-shadow:
                0 18px 45px rgba(15, 23, 42, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
        }

        .metric-card__label {
            margin: 0 0 4px;
            font-size: 12px;
            color: #6b7280;
        }

        .metric-card__value {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 600;
        }

        .metric-card__meta {
            margin: 0;
            font-size: 12px;
        }

        .is-up {
            color: #16a34a;
        }

        .is-down {
            color: #dc2626;
        }

        /* 下方内容区 */

        .section {
            padding: 30px 0 44px;
        }

        .section__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section__header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
        }

        .section__header span {
            font-size: 12px;
            color: #9ca3af;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            padding: 14px 16px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .table th,
        .table td {
            padding: 6px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .table th {
            text-align: left;
            color: #6b7280;
            font-weight: 500;
        }

        .table__cell--right {
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="page">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="container header__inner">
                <div class="logo">
                    <span class="logo__mark"></span> <span class="logo__text">个人财务管理系统</span>
                </div>
                <div class="header__actions">
                    <button class="header__link">产品文档</button>
                    <button class="header__link">帮助中心</button>
                    <button class="btn btn--ghost">登录</button>
                    <button class="btn btn--primary">立即体验</button>
                </div>
            </div>
        </header>
        <!-- Hero 主区域 -->
        <main>
            <section class="hero">
                <div class="container hero__inner">
                    <div class="hero__badge">
                        高效 · 清晰 · 可控
                    </div>
                    <h1 class="hero__title">一站式个人财务中台</h1>
                    <p class="hero__subtitle">
                        整合资产、收入与支出，帮你看清每一分钱的去向，做更安心的决定。
                    </p>
                    <div class="hero__actions">
                        <button class="btn btn--primary">开始管理财务</button> <button class="btn btn--ghost">查看演示数据</button>
                    </div>
                    <p class="hero__hint"> 无需安装 · 浏览器即用 · 支持多终端同步
                    </p>

                    <!-- 概览卡片 -->
                    <div class="hero-metrics">
                        <div class="metric-card">
                            <p class="metric-card__label">当前总资产</p>
                            <p class="metric-card__value">¥ 128,930.00</p>
                            <p class="metric-card__meta is-up">较上月 +3.2%</p>
                        </div>
                        <div class="metric-card">
                            <p class="metric-card__label">本月收入</p>
                            <p class="metric-card__value">¥ 18,400.00</p>
                            <p class="metric-card__meta is-up">较上月 +8.5%</p>
                        </div>
                        <div class="metric-card">
                            <p class="metric-card__label">本月支出</p>
                            <p class="metric-card__value">¥ 9,720.00</p>
                            <p class="metric-card__meta is-down">较上月 -2.1%</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 下方最近流水 -->
            <section class="section">
                <div class="container">
                    <div class="section__header">
                        <h2>最近流水</h2>
                        <span>示例数据，用于展示列表样式</span>
                    </div>
                    <div class="card">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>类型</th>
                                    <th>分类</th>
                                    <th class="table__cell--right">金额</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>03-25</td>
                                    <td>收入</td>
                                    <td>工资</td>
                                    <td class="table__cell--right is-up">+12000.00</td>
                                </tr>
                                <tr>
                                    <td>03-23</td>
                                    <td>支出</td>
                                    <td>房租</td>
                                    <td class="table__cell--right is-down">-3200.00</td>
                                </tr>
                                <tr>
                                    <td>03-22</td>
                                    <td>支出</td>
                                    <td>餐饮</td>
                                    <td class="table__cell--right is-down">-260.00</td>
                                </tr>
                                <tr>
                                    <td>03-21</td>
                                    <td>收入</td>
                                    <td>副业</td>
                                    <td class="table__cell--right is-up">+1800.00</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
